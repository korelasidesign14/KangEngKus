function extractYouTubeId(raw) {
  if (!raw) return null;
  const v = String(raw).trim();
  // sudah berupa ID YouTube yang valid (11 karakter)
  if (/^[a-zA-Z0-9_-]{11}$/.test(v)) return v;
  // berupa link lengkap -> ambil ID-nya
  const patterns = [
    /(?:youtube\.com\/watch\?v=)([a-zA-Z0-9_-]{11})/,
    /(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/,
    /(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
    /(?:youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
  ];
  for (const p of patterns) {
    const m = v.match(p);
    if (m) return m[1];
  }
  return null; // format tidak dikenali -> dianggap belum ada video (tampil "Segera Hadir")
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], next = text[i + 1];
    if (inQuotes) {
      if (ch === '"' && next === '"') { field += '"'; i++; }
      else if (ch === '"') { inQuotes = false; }
      else { field += ch; }
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ",") { row.push(field); field = ""; }
      else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (ch === "\r") { /* skip */ }
      else field += ch;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const header = rows[0].map((h) => h.trim().toLowerCase());
  return rows.slice(1).filter((r) => r.some((c) => c.trim() !== "")).map((r) => {
    const obj = {};
    header.forEach((h, i) => (obj[h] = (r[i] || "").trim()));
    return obj;
  });
}

async function fetchSheetTab(gid) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Gagal mengambil data sheet");
  return parseCSV(await res.text());
}

const DataContext = createContext(null);

function useSheetData(defaults) {
  const [state, setState] = useState({ ...defaults, live: false, loading: !!SHEET_ID });

  useEffect(() => {
    if (!SHEET_ID) return; // pakai data bawaan
    let cancelled = false;
    (async () => {
      try {
        const [statsRows, videoRows, dlRows, facRows] = await Promise.all([
          fetchSheetTab(SHEET_GIDS.stats).catch(() => null),
          fetchSheetTab(SHEET_GIDS.videos).catch(() => null),
          fetchSheetTab(SHEET_GIDS.downloads).catch(() => null),
          fetchSheetTab(SHEET_GIDS.facilities).catch(() => null),
        ]);
        if (cancelled) return;
        const TONES = ["primary", "secondary", "accent"];
        setState({
          stats: statsRows && statsRows.length
            ? statsRows.map((r) => ({ label: r.label || "", value: Number(r.value) || 0, suffix: r.suffix || "" }))
            : defaults.stats,
          videos: videoRows && videoRows.length
            ? videoRows.map((r, i) => ({ id: i + 1, title: r.judul || "", cat: r.kategori || "", dur: r.durasi || "", tone: TONES[i % 3], youtubeId: extractYouTubeId(r.youtube_id) }))
            : defaults.videos,
          downloads: dlRows && dlRows.length
            ? dlRows.map((r) => ({ title: r.judul || "", cat: r.kategori || "", format: r.format || "", size: r.ukuran || "", file: r.file || null }))
            : defaults.downloads,
          facilities: facRows && facRows.length
            ? facRows.map((r) => ({ name: r.nama || "", district: r.kecamatan || "", address: r.alamat || "", service: (r.layani_kusta || "").toLowerCase().startsWith("y") }))
            : defaults.facilities,
          live: true,
          loading: false,
        });
      } catch (e) {
        if (!cancelled) setState((s) => ({ ...s, loading: false }));
      }
    })();
    return () => { cancelled = true; };
  }, []);

  return state;
}

function Button({ children, variant = "primary", size = "md", className = "", ...props }) {
  const base =
    "inline-flex items-center justify-center gap-2 font-semibold rounded-[20px] transition-all duration-200 active:scale-95 disabled:opacity-50";
  const sizes = { md: "px-5 py-3 text-sm", lg: "px-7 py-4 text-base", sm: "px-4 py-2 text-xs" };
  const variants = {
    primary: "text-white shadow-lg shadow-green-500/25 hover:shadow-xl hover:shadow-green-500/35 hover:-translate-y-0.5",
    secondary: "text-white shadow-lg shadow-sky-500/25 hover:shadow-xl hover:-translate-y-0.5",
    outline: "border-2 bg-white hover:bg-slate-50",
    ghost: "hover:bg-slate-100 text-slate-600",
    accent: "text-white shadow-lg shadow-amber-500/25 hover:-translate-y-0.5",
  };
  const styleByVariant = {
    primary: { background: `linear-gradient(135deg, ${COLORS.primary}, ${COLORS.primaryDark})` },
    secondary: { background: `linear-gradient(135deg, ${COLORS.secondary}, #0369A1)` },
    outline: { borderColor: COLORS.primary, color: COLORS.primaryDark },
    accent: { background: `linear-gradient(135deg, ${COLORS.accent}, #D97706)` },
    ghost: {},
  };
  return (
    <button
      className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}
      style={styleByVariant[variant]}
      {...props}
    >
      {children}
    </button>
  );
}

function ProgressRing({ value, size = 44 }) {
  const r = (size - 6) / 2;
  const c = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} className="-rotate-90">
      <circle cx={size / 2} cy={size / 2} r={r} stroke="#E2E8F0" strokeWidth="5" fill="none" />
      <circle
        cx={size / 2}
        cy={size / 2}
        r={r}
        stroke={COLORS.primary}
        strokeWidth="5"
        fill="none"
        strokeDasharray={c}
        strokeDashoffset={c - (value / 100) * c}
        strokeLinecap="round"
        style={{ transition: "stroke-dashoffset 0.6s ease" }}
      />
    </svg>
  );
}

function AnimatedNumber({ value }) {
  const [n, setN] = useState(0);
  const ref = useRef(null);
  const [started, setStarted] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting && !started) setStarted(true);
      },
      { threshold: 0.4 }
    );
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, [started]);
  useEffect(() => {
    if (!started) return;
    let raf;
    const duration = 1200;
    const t0 = performance.now();
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / duration);
      setN(Math.floor(p * value));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [started, value]);
  return <span ref={ref}>{n.toLocaleString("id-ID")}</span>;

function MythsView() {
  const [idx, setIdx] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [done, setDone] = useState(0);
  const m = MYTHS[idx];

  const next = () => {
    if (idx < MYTHS.length - 1) {
      setIdx(idx + 1);
      setRevealed(false);
    } else {
      setIdx(0);
      setRevealed(false);
      setDone(0);
    }
  };

  const reveal = () => {
    if (!revealed) setDone((d) => d + 1);
    setRevealed(true);
  };

  return (
    <section className="max-w-3xl mx-auto px-5 py-14">
      <SectionHeading eyebrow="Mitos vs Fakta" title="Uji Pemahamanmu tentang Kusta" subtitle="Sentuh kartu untuk melihat faktanya. Semua pernyataan mitos di bawah ini TIDAK BENAR." center />

      <div className="flex justify-center gap-1.5 mb-6">
        {MYTHS.map((_, i) => (
          <span key={i} className={`h-1.5 rounded-full transition-all ${i === idx ? "w-8" : "w-1.5"}`} style={{ background: i <= idx ? COLORS.primary : "#E2E8F0" }} />
        ))}
      </div>

      <div className="relative h-80 [perspective:1200px]">
        <div
          onClick={reveal}
          className="absolute inset-0 cursor-pointer transition-transform duration-500 [transform-style:preserve-3d]"
          style={{ transform: revealed ? "rotateY(180deg)" : "rotateY(0deg)" }}
        >
          {/* front - myth */}
          <div className="absolute inset-0 rounded-[20px] p-8 flex flex-col items-center justify-center text-center [backface-visibility:hidden]" style={{ background: `linear-gradient(135deg, #FEE2E2, #FEF3C7)` }}>
            <Badge tone="accent"><Frown size={12} /> MITOS</Badge>
            <p className="text-xl md:text-2xl font-bold text-slate-800 mt-5">&ldquo;{m.myth}&rdquo;</p>
            <p className="text-sm text-slate-500 mt-6">Sentuh kartu untuk lihat faktanya →</p>
          </div>
          {/* back - fact */}
          <div
            className="absolute inset-0 rounded-[20px] p-8 flex flex-col items-center justify-center text-center [backface-visibility:hidden]"
            style={{ background: `linear-gradient(135deg, #DCFCE7, #E0F2FE)`, transform: "rotateY(180deg)" }}
          >
            <Badge tone="primary"><Smile size={12} /> FAKTA</Badge>
            <p className="text-lg md:text-xl font-semibold text-slate-800 mt-5">{m.fact}</p>
          </div>
        </div>
      </div>

      <div className="flex justify-center gap-3 mt-8">
        <Button variant="outline" onClick={() => { setIdx((i) => (i === 0 ? MYTHS.length - 1 : i - 1)); setRevealed(false); }}>
          <ChevronLeft size={16} /> Sebelumnya
        </Button>
        <Button onClick={next}>
          {idx === MYTHS.length - 1 && revealed ? <><RotateCcw size={16} /> Ulangi</> : <>Berikutnya <ChevronRight size={16} /></>}
        </Button>
      </div>
    </section>
  );
}

/* ============================================================
   SELF SCREENING
============================================================ */
function ScreeningView({ setView }) {
  const [step, setStep] = useState(0); // 0..N-1 questions, N = result
  const [answers, setAnswers] = useState({});
  const total = SCREENING_QUESTIONS.length;
  const finished = step >= total;

  const answer = (val) => {
    const q = SCREENING_QUESTIONS[step];
    setAnswers((a) => ({ ...a, [q.id]: val }));
    setStep((s) => s + 1);
  };

  const yesCount = Object.values(answers).filter((v) => v === true).length;
  let risk = "Rendah";
  let riskColor = COLORS.primary;
  let riskDesc = "Kecil kemungkinan tanda kusta, tapi tetap kenali gejalanya.";
  if (yesCount >= 4) {
    risk = "Tinggi";
    riskColor = "#EF4444";
    riskDesc = "Beberapa tanda mengarah pada gejala kusta. Segera periksakan diri.";
  } else if (yesCount >= 2) {
    risk = "Sedang";
    riskColor = COLORS.accent;
    riskDesc = "Ada beberapa tanda yang perlu diperiksa lebih lanjut oleh petugas kesehatan.";
  }

  const restart = () => { setStep(0); setAnswers({}); };

  return (
    <section className="max-w-2xl mx-auto px-5 py-14">
      <SectionHeading eyebrow="Skrining Mandiri" title="Cek Risiko Kustamu" subtitle="Jawab dengan jujur, hasil hanya untuk membantumu memutuskan langkah selanjutnya." center />

      {!finished ? (
        <Card className="p-8" hover={false}>
          <div className="flex items-center justify-between mb-6">
            <span className="text-sm font-semibold text-slate-400">Pertanyaan {step + 1} dari {total}</span>
            <div className="w-32 h-2 bg-slate-100 rounded-full overflow-hidden">
              <div className="h-full rounded-full transition-all duration-500" style={{ width: `${((step) / total) * 100}%`, background: COLORS.primary }} />
            </div>
          </div>
          <div className="flex justify-center mb-6">
            <Mascot size={110} pose="point" />
          </div>
          <h3 className="text-xl font-bold text-slate-900 text-center mb-8">{SCREENING_QUESTIONS[step].text}</h3>
          <div className="grid grid-cols-2 gap-4">
            <button onClick={() => answer(true)} className="py-5 rounded-[20px] border-2 font-bold text-lg transition-all hover:-translate-y-0.5" style={{ borderColor: COLORS.primary, color: COLORS.primaryDark }}>
              Ya
            </button>
            <button onClick={() => answer(false)} className="py-5 rounded-[20px] border-2 border-slate-200 text-slate-500 font-bold text-lg hover:bg-slate-50 transition-all hover:-translate-y-0.5">
              Tidak
            </button>
          </div>
        </Card>
      ) : (
        <Card className="p-8 text-center" hover={false}>
          <div className="flex justify-center mb-4"><Mascot size={120} pose="wave" /></div>
          <Badge tone="slate">Hasil Skrining Mandiri</Badge>
          <h3 className="text-2xl font-extrabold mt-4 mb-2" style={{ color: riskColor }}>Risiko {risk}</h3>
          <p className="text-slate-500 mb-6">{riskDesc}</p>

          <div className="bg-amber-50 border border-amber-200 rounded-[16px] p-4 text-left flex gap-3 mb-6">
            <Info size={20} className="text-amber-600 shrink-0 mt-0.5" />
            <p className="text-sm text-amber-800">
              Ini <strong>BUKAN diagnosis medis</strong>. Silakan kunjungi fasilitas kesehatan terdekat untuk pemeriksaan lebih lanjut oleh tenaga medis.
            </p>
          </div>

          <div className="flex flex-col sm:flex-row gap-3">
            <Button className="flex-1" onClick={() => setView("locator")}>
              <MapPin size={16} /> Cari Fasilitas Kesehatan
            </Button>
            <Button variant="outline" className="flex-1" onClick={restart}>
              <RotateCcw size={16} /> Ulangi Skrining
            </Button>
          </div>

          <a
            href="https://wa.me/6289677399649"
            target="_blank"
            rel="noopener noreferrer"
            className="mt-3 w-full inline-flex items-center justify-center gap-2 font-semibold rounded-[20px] px-5 py-3 text-sm text-white shadow-lg shadow-sky-500/25 hover:shadow-xl hover:-translate-y-0.5 transition-all duration-200"
            style={{ background: `linear-gradient(135deg, ${COLORS.secondary}, #0369A1)` }}
          >
            <Phone size={16} /> Hubungi Pak Wasor (WhatsApp)
          </a>
        </Card>

/* ============================================================
   REPORT SUSPECTED CASE
============================================================ */
function ReportView() {
  const [sent, setSent] = useState(false);
  const [sendError, setSendError] = useState(false);
  const [consent, setConsent] = useState(false);
  const [form, setForm] = useState({ name: "", phone: "", address: "", district: DISTRICTS[1], complaint: "" });

  const buildWaLink = () => {
    const lines = [
      "Halo Pak Wasor, saya ingin melaporkan dugaan kasus kusta melalui situs KANG ENGKUS:",
      "",
      `Nama: ${form.name}`,
      `No. Telepon: ${form.phone}`,
      `Alamat: ${form.address}`,
      `Kecamatan: ${form.district}`,
      `Keluhan/Ciri-ciri: ${form.complaint}`,
    ];
    const text = encodeURIComponent(lines.join("\n"));
    return `https://wa.me/${WASOR_WA_NUMBER}?text=${text}`;
  };

  const submit = (e) => {
    e.preventDefault();
    if (!consent) return;
    setSendError(false);
    try {
      const link = buildWaLink();
      window.open(link, "_blank", "noopener,noreferrer");
      setSent(true);
    } catch (err) {
      setSendError(true);
    }
  };

  if (sent) {
    return (
      <section className="max-w-xl mx-auto px-5 py-20 text-center">
        <div className="flex justify-center mb-4"><Mascot size={140} pose="wave" /></div>
        <div className="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-5">
          <CheckCircle2 size={32} style={{ color: COLORS.primaryDark }} />
        </div>
        <h3 className="text-2xl font-extrabold text-slate-900 mb-3">Hampir selesai!</h3>
        <p className="text-slate-500 mb-6">Sebuah tab WhatsApp baru telah dibuka dengan pesan laporanmu ke Pak Wasor Kusta. Tinggal ditinjau lalu tekan kirim di WhatsApp untuk menyelesaikan laporan.</p>
        <div className="flex flex-col sm:flex-row gap-3 justify-center">
          <a
            href={buildWaLink()}
            target="_blank"
            rel="noopener noreferrer"
            className="inline-flex items-center justify-center gap-2 font-semibold rounded-[20px] px-5 py-3 text-sm text-white shadow-lg shadow-green-500/25 hover:shadow-xl hover:-translate-y-0.5 transition-all duration-200"
            style={{ background: `linear-gradient(135deg, ${COLORS.primary}, ${COLORS.primaryDark})` }}
          >
            <Phone size={16} /> Buka WhatsApp Lagi
          </a>
          <Button variant="outline" onClick={() => { setSent(false); setForm({ name: "", phone: "", address: "", district: DISTRICTS[1], complaint: "" }); setConsent(false); }}>
            Kirim Laporan Lain
          </Button>
        </div>
      </section>
    );
  }

  return (
    <section className="max-w-xl mx-auto px-5 py-14">
      <SectionHeading eyebrow="Laporkan Kasus Terduga" title="Bantu Kami Menjangkau Lebih Cepat" subtitle="Laporan dikirim langsung ke WhatsApp Pak Wasor Kusta dan hanya digunakan untuk keperluan tindak lanjut kesehatan." center />
      <Card className="p-7" hover={false}>
        <form onSubmit={submit} className="space-y-4">
          <div>
            <label className="text-sm font-semibold text-slate-700 block mb-1.5">Nama</label>
            <input required value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="w-full px-4 py-3 rounded-[16px] border border-slate-200 focus:outline-none focus:ring-2 focus:ring-green-300 text-sm" placeholder="Nama lengkap" />
          </div>
          <div>
            <label className="text-sm font-semibold text-slate-700 block mb-1.5">Nomor Telepon</label>
            <input required value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} className="w-full px-4 py-3 rounded-[16px] border border-slate-200 focus:outline-none focus:ring-2 focus:ring-green-300 text-sm" placeholder="08xxxxxxxxxx" />
          </div>
          <div>
            <label className="text-sm font-semibold text-slate-700 block mb-1.5">Alamat</label>
            <input required value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })} className="w-full px-4 py-3 rounded-[16px] border border-slate-200 focus:outline-none focus:ring-2 focus:ring-green-300 text-sm" placeholder="Alamat lengkap" />
          </div>
          <div>
            <label className="text-sm font-semibold text-slate-700 block mb-1.5">Kecamatan</label>
            <select value={form.district} onChange={(e) => setForm({ ...form, district: e.target.value })} className="w-full px-4 py-3 rounded-[16px] border border-slate-200 focus:outline-none focus:ring-2 focus:ring-green-300 text-sm bg-white">
              {DISTRICTS.slice(1).map((d) => <option key={d}>{d}</option>)}
            </select>
          </div>
          <div>
            <label className="text-sm font-semibold text-slate-700 block mb-1.5">Keluhan</label>
            <textarea required value={form.complaint} onChange={(e) => setForm({ ...form, complaint: e.target.value })} rows={4} className="w-full px-4 py-3 rounded-[16px] border border-slate-200 focus:outline-none focus:ring-2 focus:ring-green-300 text-sm resize-none" placeholder="Ceritakan keluhan atau tanda yang terlihat..." />
          </div>
          <div>
            <label className="text-sm font-semibold text-slate-700 block mb-1.5">Foto (opsional)</label>
            <label className="flex items-center justify-center gap-2 border-2 border-dashed border-slate-200 rounded-[16px] py-6 text-slate-400 text-sm cursor-pointer hover:border-green-300 hover:text-green-600 transition-colors">
              <Camera size={18} /> Unggah foto pendukung
              <input type="file" className="hidden" />
            </label>
          </div>
          <label className="flex items-start gap-3 cursor-pointer">
            <input type="checkbox" checked={consent} onChange={(e) => setConsent(e.target.checked)} className="mt-1 w-4 h-4 accent-green-600" />
            <span className="text-xs text-slate-500">Saya menyetujui data ini digunakan oleh petugas kesehatan untuk keperluan tindak lanjut, sesuai kebijakan privasi.</span>
          </label>
          {sendError && (
            <div className="bg-red-50 border border-red-200 rounded-[16px] p-4 flex gap-3">
              <AlertTriangle size={18} className="text-red-600 shrink-0 mt-0.5" />
              <p className="text-xs text-red-700">Gagal membuka WhatsApp. Pastikan browser mengizinkan pop-up, atau hubungi Pak Wasor langsung di 0896-7739-9649.</p>
            </div>
          )}
          <Button type="submit" size="lg" className="w-full" disabled={!consent}>
            <Send size={16} /> Kirim Laporan via WhatsApp
          </Button>
        </form>
      </Card>
    </section>
  );
}

/* ============================================================
   FLOATING MASCOT TIP
============================================================ */
function FloatingMascot() {
  const [open, setOpen] = useState(false);
  const [tip, setTip] = useState(MASCOT_TIPS[0]);
  const show = () => {
    setTip(MASCOT_TIPS[Math.floor(Math.random() * MASCOT_TIPS.length)]);
    setOpen((o) => !o);
  };
  return (
    <div className="fixed bottom-5 right-5 z-40 flex flex-col items-end gap-3">
      {open && (
        <div className="max-w-[220px] bg-white rounded-[16px] shadow-xl p-4 text-sm text-slate-600 relative animate-[popIn_0.25s_ease]">
          <button onClick={() => setOpen(false)} className="absolute top-2 right-2 text-slate-300 hover:text-slate-500"><X size={14} /></button>
          <span className="font-bold text-slate-900 block mb-1">Kang EngKus bilang:</span>
          {tip}
        </div>
      )}
      <button onClick={show} className="w-16 h-16 rounded-full shadow-xl flex items-center justify-center overflow-hidden bg-white border-4 border-white hover:scale-105 transition-transform" style={{ boxShadow: "0 10px 30px rgba(34,197,94,0.35)" }}>
        <Mascot size={70} pose="wave" />
      </button>
      <style>{`@keyframes popIn{0%{opacity:0;transform:translateY(10px) scale(0.9)}100%{opacity:1;transform:translateY(0) scale(1)}}`}</style>
    </div>
  );
}

/* ============================================================
   APP ROOT
============================================================ */
export default function App() {
  const [view, setView] = useState("home");
  const [progress, setProgress] = useState({});
  const sheetData = useSheetData({
    stats: DEFAULT_STATS,
    videos: DEFAULT_VIDEOS,
    downloads: DEFAULT_DOWNLOADS,
    facilities: DEFAULT_FACILITIES,
  });

  // Kirim "virtual pageview" ke Google Analytics tiap kali menu berpindah,
  // supaya kelihatan menu mana yang paling sering dibuka (bukan cuma total
  // kunjungan ke satu halaman saja, karena situs ini single-page app).
  useEffect(() => {
    if (typeof window.gtag === "function") {
      window.gtag("event", "page_view", {
        page_title: "KANG ENGKUS - " + view,
        page_path: "/" + view,
      });
    }
  }, [view]);

  const changeView = (v) => {
    setView(v);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const toggleProgress = (id) => setProgress((p) => ({ ...p, [id]: !p[id] }));

  let content;
  if (view === "home") {
    content = (
      <>
        <Hero setView={changeView} />
        <HomeMenu setView={changeView} />
        <QuickPromo setView={changeView} />
      </>
    );
  } else if (view === "learn") content = <LearnView progress={progress} toggleProgress={toggleProgress} />;
  else if (view === "videos") content = <VideosView />;
  else if (view === "myths") content = <MythsView />;
  else if (view === "screening") content = <ScreeningView setView={changeView} />;
  else if (view === "locator") content = <LocatorView />;
  else if (view === "report") content = <ReportView />;
  else if (view === "downloads") content = <DownloadsView />;
  else if (view === "about") content = <AboutView />;
  else content = <Hero setView={changeView} />;

  return (
    <DataContext.Provider value={sheetData}>
      <div style={{ background: COLORS.bg, fontFamily: "'Poppins', sans-serif" }} className="min-h-screen text-slate-800">
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
          * { -webkit-tap-highlight-color: transparent; }
          ::selection { background: #BBF7D0; }
        `}</style>
        <Header view={view} setView={changeView} />
        <main>{content}</main>
        <Footer setView={changeView} />
        <FloatingMascot />
      </div>
    </DataContext.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
